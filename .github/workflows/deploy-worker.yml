name: Deploy Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Create Worker
        run: |
          mkdir -p worker
          cat > worker/index.js <<'EOF'
          export default {
            async fetch(request, env) {
              if (request.method === "OPTIONS") {
                return new Response(null, {
                  headers: {
                    "Access-Control-Allow-Origin": "*",
                    "Access-Control-Allow-Methods": "POST, OPTIONS",
                    "Access-Control-Allow-Headers": "Content-Type"
                  }
                });
              }

              if (request.method !== "POST") {
                return new Response("JARVIS Worker ONLINE", {
                  headers: {
                    "Access-Control-Allow-Origin": "*"
                  }
                });
              }

              try {
                const body = await request.json();
                const text = body.text || "";

                const response = await fetch(
                  "https://api.openai.com/v1/responses",
                  {
                    method: "POST",
                    headers: {
                      "Content-Type": "application/json",
                      "Authorization": `Bearer ${env.OPENAI_API_KEY}`
                    },
                    body: JSON.stringify({
                      model: "gpt-5-mini",
                      input: `あなたはJ.A.R.V.I.S.です。日本語で自然に会話してください。ユーザー: ${text}`
                    })
                  }
                );

                const data = await response.json();

                if (!response.ok) {
                  return new Response(
                    JSON.stringify({
                      error: data
                    }),
                    {
                      status: response.status,
                      headers: {
                        "Content-Type": "application/json",
                        "Access-Control-Allow-Origin": "*"
                      }
                    }
                  );
                }

                const reply =
                  data.output_text ||
                  "申し訳ありません。回答を取得できませんでした。";

                return new Response(
                  JSON.stringify({ reply }),
                  {
                    headers: {
                      "Content-Type": "application/json",
                      "Access-Control-Allow-Origin": "*"
                    }
                  }
                );

              } catch (error) {
                return new Response(
                  JSON.stringify({
                    error: error.message
                  }),
                  {
                    status: 500,
                    headers: {
                      "Content-Type": "application/json",
                      "Access-Control-Allow-Origin": "*"
                    }
                  }
                );
              }
            }
          };
          EOF

          cat > worker/wrangler.toml <<EOF
          name = "jarvis-voice"
          main = "index.js"
          compatibility_date = "2026-08-24"

          [vars]
          EOF

          cp worker/index.js worker/index.js
          cp worker/wrangler.toml worker/wrangler.toml

      - name: Deploy to Cloudflare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy