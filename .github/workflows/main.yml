name: Deploy JARVIS

on:
  push:
    branches:
      - main
    paths:
      - "jarvis/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload JARVIS
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./jarvis"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
