<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>J.A.R.V.I.S. Web Search</title>

  <style>
    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      background: #000;
      color: #fff;

      padding: 25px 18px;

      line-height: 1.7;
    }

    h1 {
      text-align: center;
      letter-spacing: 4px;
    }

    #status {
      text-align: center;
      margin: 20px 0;
    }

    #query {
      font-size: 20px;
      text-align: center;
      margin: 20px 0;
    }

    #answer {
      max-width: 700px;
      margin: 25px auto;
      padding: 20px;

      border: 1px solid #444;
      border-radius: 12px;

      font-size: 19px;
    }

    #result {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;

      border: 1px solid #333;
      border-radius: 12px;
    }

    #result article {
      margin-bottom: 25px;
      padding-bottom: 20px;

      border-bottom: 1px solid #333;
    }

    #result h2 {
      font-size: 21px;
    }

    #result a {
      color: #8fd3ff;
    }

    button {
      display: block;

      margin: 20px auto;
      padding: 14px 25px;

      font-size: 17px;

      border: none;
      border-radius: 10px;

      cursor: pointer;
    }

    #speakButton {
      background: #fff;
      color: #000;
    }

    #googleButton {
      background: #333;
      color: #fff;
    }
  </style>
</head>

<body>

  <h1>
    J.A.R.V.I.S.
  </h1>


  <div id="status">
    検索しています...
  </div>


  <div id="query"></div>


  <div id="answer">
    JARVISが情報を確認しています...
  </div>


  <button id="speakButton">
    🔊 JARVISに答えを読み上げさせる
  </button>


  <div id="result">
    検索結果を取得しています...
  </div>


  <button id="googleButton">
    🔎 Googleでも検索
  </button>


  <script>

    // ========================================
    // URLから検索ワード取得
    // ========================================

    const params =
      new URLSearchParams(
        window.location.search
      );

    const query =
      params.get("q") || "";


    // ========================================
    // 画面要素
    // ========================================

    const status =
      document.getElementById("status");

    const queryElement =
      document.getElementById("query");

    const answer =
      document.getElementById("answer");

    const result =
      document.getElementById("result");

    const speakButton =
      document.getElementById("speakButton");

    const googleButton =
      document.getElementById("googleButton");


    // ========================================
    // 読み上げ文章
    // ========================================

    let speechText = "";


    // ========================================
    // 検索ワード表示
    // ========================================

    queryElement.textContent =
      query
        ? `「${query}」を調べています`
        : "検索内容がありません";


    // ========================================
    // JARVIS用回答
    // ========================================

    function createJarvisAnswer(
      searchQuery,
      pages
    ) {

      if (!pages.length) {

        return (
          `「${searchQuery}」について、` +
          `情報を見つけられませんでした。`
        );
      }


      const first =
        pages[0];


      let text =
        `「${searchQuery}」について検索しました。`;


      if (first.title) {

        text +=
          `まず、${first.title}についてです。`;
      }


      if (first.extract) {

        let summary =
          first.extract.trim();


        if (summary.length > 180) {

          summary =
            summary.substring(
              0,
              180
            ) +
            "。";
        }


        text +=
          summary;
      }


      if (pages.length > 1) {

        text +=
          ` 関連する情報も` +
          `${pages.length}件確認しました。`;
      }


      return text;
    }


    // ========================================
    // ネット検索
    // ========================================

    async function searchWeb() {

      if (!query) {

        status.textContent =
          "検索エラー";

        answer.textContent =
          "検索する内容がありません。";

        result.textContent =
          "検索ワードを指定してください。";

        speakButton.disabled =
          true;

        return;
      }


      status.textContent =
        "🌐 ネット検索中...";


      try {

        const url =
          "https://ja.wikipedia.org/w/api.php" +
          "?action=query" +
          "&generator=search" +
          "&gsrsearch=" +
          encodeURIComponent(query) +
          "&gsrnamespace=0" +
          "&gsrlimit=5" +
          "&prop=extracts|info" +
          "&exintro=1" +
          "&explaintext=1" +
          "&inprop=url" +
          "&format=json" +
          "&origin=*";


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            "検索に失敗しました"
          );
        }


        const data =
          await response.json();


        const pages =
          data.query &&
          data.query.pages
            ? Object.values(
                data.query.pages
              )
            : [];


        if (!pages.length) {

          status.textContent =
            "検索結果なし";

          answer.textContent =
            `「${query}」について、` +
            `情報を見つけられませんでした。`;

          result.innerHTML =
            "検索結果がありませんでした。";

          speakButton.disabled =
            true;

          return;
        }


        // ====================================
        // JARVIS回答作成
        // ====================================

        speechText =
          createJarvisAnswer(
            query,
            pages
          );


        answer.textContent =
          speechText;


        status.textContent =
          `🔎 ${pages.length}件を確認しました`;


        // ====================================
        // 検索結果表示
        // ====================================

        result.innerHTML = "";


        pages.forEach(
          (page) => {

            const article =
              document.createElement(
                "article"
              );


            const title =
              document.createElement(
                "h2"
              );


            title.textContent =
              page.title ||
              "情報";


            const extract =
              document.createElement(
                "p"
              );


            extract.textContent =
              page.extract ||
              "概要を取得できませんでした。";


            article.appendChild(
              title
            );


            article.appendChild(
              extract
            );


            if (page.fullurl) {

              const link =
                document.createElement(
                  "a"
                );


              link.href =
                page.fullurl;


              link.target =
                "_blank";


              link.rel =
                "noopener";


              link.textContent =
                "詳しく見る";


              article.appendChild(
                link
              );
            }


            result.appendChild(
              article
            );
          }
        );


      } catch (error) {

        console.error(error);


        status.textContent =
          "検索エラー";


        answer.textContent =
          "ネット検索中にエラーが発生しました。";


        result.textContent =
          "検索結果を取得できませんでした。";


        speakButton.disabled =
          true;
      }
    }


    // ========================================
    // 自然なJARVIS音声
    // ========================================

    speakButton.addEventListener(
      "click",
      () => {

        if (!speechText) {
          return;
        }


        if (
          !("speechSynthesis" in window)
        ) {

          answer.textContent +=
            " このブラウザでは音声読み上げを利用できません。";

          return;
        }


        // 前の音声を停止

        window.speechSynthesis.cancel();


        // 少し自然な話し方にするため、
        // 文章を区切って読み上げる

        const sentences =
          speechText
            .split(/(?<=[。！？])/)
            .map(
              text => text.trim()
            )
            .filter(
              text => text.length > 0
            );


        status.textContent =
          "🔊 JARVISが回答しています";


        let index = 0;


        function speakNext() {

          if (index >= sentences.length) {

            status.textContent =
              "回答完了";

            return;
          }


          const text =
            sentences[index];


          const utterance =
            new SpeechSynthesisUtterance(
              text
            );


          utterance.lang =
            "ja-JP";


          // 少しゆっくり

          utterance.rate =
            0.85;


          // 少し落ち着いた声

          utterance.pitch =
            0.95;


          utterance.volume =
            1.0;


          utterance.onend =
            () => {

              index++;


              // 文と文の間に
              // 少しだけ間を入れる

              setTimeout(
                speakNext,
                180
              );
            };


          utterance.onerror =
            () => {

              statusText =
                "読み上げエラー";
            };


          window.speechSynthesis.speak(
            utterance
          );
        }


        speakNext();
      }
    );


    // ========================================
    // Google検索
    // ========================================

    googleButton.addEventListener(
      "click",
      () => {

        if (!query) {
          return;
        }


        const googleURL =
          "https://www.google.com/search?q=" +
          encodeURIComponent(query);


        window.location.href =
          googleURL;
      }
    );


    // ========================================
    // 検索開始
    // ========================================

    searchWeb();

  </script>

</body>
</html>
