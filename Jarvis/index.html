<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>J.A.R.V.I.S.</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <main class="jarvis">

    <div class="status">
      <span class="status-dot"></span>
      SYSTEM ONLINE
    </div>


    <h1>
      J.A.R.V.I.S.
    </h1>


    <p class="subtitle">
      JUST A RATHER VERY INTELLIGENT SYSTEM
    </p>


    <div class="core">
      <div class="core-inner"></div>
    </div>


    <p id="message">
      何をしましょうか？
    </p>


    <button id="talkButton">
      🎙️ 話す
    </button>


    <div class="activity">

      <p>
        STATUS
      </p>

      <span id="statusText">
        待機中
      </span>

    </div>

  </main>


  <!--
    ?v=3 を付けて、
    iPhone Safariの古いapp.jsキャッシュを
    強制的に更新する
  -->

  <script src="app.js?v=3"></script>

</body>
</html>
