<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>J.A.R.V.I.S. Search</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 30px 20px;
    }

    h1 {
      font-size: 32px;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    .status {
      margin-top: 20px;
      font-size: 18px;
    }

    .query {
      margin-top: 25px;
      font-size: 22px;
      line-height: 1.6;
    }

    button {
      margin-top: 25px;
      padding: 14px 30px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>J.A.R.V.I.S.</h1>

  <div class="status" id="status">
    検索準備中...
  </div>

  <div class="query" id="query">
  </div>

  <button id="searchButton">
    🔎 Googleで検索
  </button>


  <script>

    // URLから検索ワードを取得
    const params =
      new URLSearchParams(window.location.search);

    const query =
      params.get("q") || "";


    const status =
      document.getElementById("status");

    const queryElement =
      document.getElementById("query");

    const searchButton =
      document.getElementById("searchButton");


    // 検索ワードを表示

    if (query) {

      queryElement.textContent =
        `「${query}」を検索します。`;

      status.textContent =
        "検索準備完了";

    } else {

      queryElement.textContent =
        "検索する内容がありません。";

      status.textContent =
        "検索エラー";

      searchButton.style.display =
        "none";
    }


    // Google検索

    searchButton.addEventListener("click", () => {

      if (!query) return;

      const googleURL =
        "https://www.google.com/search?q=" +
        encodeURIComponent(query);

      window.location.href =
        googleURL;
    });


    // 検索ページを開いたとき
    // すぐGoogleへ移動するのではなく、
    // iPhone Safariで確実に動かすため
    // ボタンを押して検索する方式にする。

  </script>

</body>
</html>
