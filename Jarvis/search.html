<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JARVIS Search</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 30px 20px;
    }

    h1 {
      font-size: 32px;
      letter-spacing: 4px;
    }

    input {
      width: 90%;
      max-width: 500px;
      padding: 15px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      margin-top: 20px;
    }

    button {
      margin-top: 15px;
      padding: 14px 30px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
    }

    #result {
      margin-top: 30px;
      font-size: 18px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <h1>J.A.R.V.I.S.</h1>

  <p>何を検索しますか？</p>

  <input
    id="searchText"
    type="text"
    placeholder="例：最新のAIニュース"
  >

  <br>

  <button id="searchButton">
    🔎 検索
  </button>

  <div id="result"></div>

  <script>

    const searchText =
      document.getElementById("searchText");

    const searchButton =
      document.getElementById("searchButton");

    const result =
      document.getElementById("result");


    searchButton.addEventListener("click", () => {

      const query =
        searchText.value.trim();

      if (!query) {
        result.textContent =
          "検索する内容を入力してください。";
        return;
      }

      result.innerHTML =
        "🔎 検索しています...";

      const url =
        "https://www.google.com/search?q=" +
        encodeURIComponent(query);

      window.open(url, "_blank");

      result.innerHTML =
        `「${query}」を検索しました。`;
    });


    searchText.addEventListener("keydown", (event) => {

      if (event.key === "Enter") {
        searchButton.click();
      }

    });

  </script>

</body>
</html>
