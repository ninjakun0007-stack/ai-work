name: Job Search AI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  job-search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r agent/job-search/requirements.txt

      - name: Run Job Search AI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python agent/job-search/agent.py

      - name: Save jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jobs.json

          if git diff --cached --quiet; then
            echo "jobs.json に変更はありません"
          else
            git commit -m "Update job search results"
            git push
          fi

      - name: Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ.get("SLACK_WEBHOOK_URL")

          if not webhook:
              print("SLACK_WEBHOOK_URL が設定されていないためSlack通知をスキップします")
              raise SystemExit(0)

          with open("jobs.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          jobs = data.get("jobs", [])

          if not jobs:
              print("条件に合う案件がありません")
              raise SystemExit(0)

          top = jobs[0]

          title = top.get("title", "案件名不明")
          reward = top.get("reward", "報酬不明")
          score = top.get("score", 0)
          automation = top.get("automation_score", 0)
          remote = top.get("remote", "不明")
          ranking = top.get("ranking_score", 0)

          application = top.get("application_candidate", {})
          priority = application.get("priority", "不明")

          reason = top.get("reason", "")

          message = (
              "🚨 *AI求人検索：応募候補を発見*\n\n"
              f"🏆 *1位：{title}*\n"
              f"💰 報酬：{reward}\n"
              f"🤖 AIスコア：{score}\n"
              f"⚙️ 自動化スコア：{automation}\n"
              f"🏠 リモート：{remote}\n"
              f"📊 総合ランキング：{ranking}\n"
              f"🔥 応募優先度：{priority}\n\n"
              f"📝 {reason}"
          )

          payload = json.dumps({
              "text": message
          }).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = response.read().decode("utf-8")
                  print("Slack通知完了:", result)

          except urllib.error.HTTPError as e:
              print("Slack通知エラー:", e.code)
              print(e.read().decode("utf-8", errors="replace"))
              raise
          PY